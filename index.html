<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPH Product Launches</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="https://kph.club/favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer data-domain="launches.kph.club" src="https://record.micro.company/script.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    },
                    colors: {
                        primary: '#ff6154',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-gray-800 font-sans">
    <header class="flex items-center p-3 md:p-4 border-b border-gray-200 sticky top-0 bg-white z-10">
        <div class="flex items-center mr-2 md:mr-5">
            <div id="logo" class="font-serif font-black text-2xl text-gray-900 cursor-pointer">KPH</div>
        </div>
        <div class="bg-gray-100 rounded-lg px-2 md:px-4 py-1 md:py-2 flex items-center w-full max-w-xs md:w-60 mr-3 md:mr-auto relative">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15.5 14H14.71L14.43 13.73C15.41 12.59 16 11.11 16 9.5C16 5.91 13.09 3 9.5 3C5.91 3 3 5.91 3 9.5C3 13.09 5.91 16 9.5 16C11.11 16 12.59 15.41 13.73 14.43L14 14.71V15.5L19 20.49L20.49 19L15.5 14ZM9.5 14C7.01 14 5 11.99 5 9.5C5 7.01 7.01 5 9.5 5C11.99 5 14 7.01 14 9.5C14 11.99 11.99 14 9.5 14Z" fill="#6f7287"/>
            </svg>
            <input id="search-input" type="text" placeholder="Search products..." class="bg-transparent border-none outline-none w-full ml-2 text-sm">
            <button id="clear-search" class="hidden absolute right-3 text-gray-400 hover:text-gray-600">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="currentColor"/>
                </svg>
            </button>
        </div>
        <nav class="hidden md:flex items-center space-x-6">
            <a href="/stats" class="text-gray-700 hover:text-primary font-medium text-sm">2026 Stats</a>
            <a href="/wrapped" class="text-gray-700 hover:text-primary font-medium text-sm">2025 Wrapped</a>
            <a href="/hackathon" class="text-gray-700 hover:text-primary font-medium text-sm">Hackathon</a>
            <a href="https://join.kph.club" class="text-gray-700 hover:text-primary font-medium text-sm">Join KPH</a>
        </nav>
        <button id="menu-button" type="button" class="md:hidden ml-auto p-2 -mr-2 text-gray-700 hover:text-primary" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
            <svg id="menu-open-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></svg>
            <svg id="menu-close-icon" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        </button>
        <nav id="mobile-menu" class="hidden md:hidden absolute top-full inset-x-0 bg-white border-b border-gray-200 shadow-sm py-1">
            <a href="/stats" class="block px-4 py-3 text-gray-700 hover:text-primary font-medium text-sm">2026 Stats</a>
            <a href="/wrapped" class="block px-4 py-3 text-gray-700 hover:text-primary font-medium text-sm">2025 Wrapped</a>
            <a href="/hackathon" class="block px-4 py-3 text-gray-700 hover:text-primary font-medium text-sm">Hackathon</a>
            <a href="https://join.kph.club" class="block px-4 py-3 text-gray-700 hover:text-primary font-medium text-sm">Join KPH</a>
        </nav>
    </header>

    <div class="max-w-7xl mx-auto px-4 md:px-6 py-4 md:py-8">
        <h1 id="page-title" class="text-xl md:text-2xl font-bold mb-3 md:mb-4 cursor-pointer hover:text-primary">KPH Product Launches 🚀</h1>

        <div id="sort-switcher" class="inline-flex items-center p-0.5 mb-4 md:mb-6 bg-gray-100 rounded-lg text-sm">
            <button type="button" data-sort="reactions" class="sort-option px-3 py-1.5 rounded-md font-medium transition-colors">Most reactions</button>
            <button type="button" data-sort="recent" class="sort-option px-3 py-1.5 rounded-md font-medium transition-colors">Recent</button>
        </div>

        <div id="loading" class="flex justify-center my-12">
            <div class="w-10 h-10 rounded-full border-4 border-gray-200 border-l-primary animate-spin"></div>
        </div>
        
        <div id="error" class="text-primary text-center py-5 hidden">
            Failed to load products. Please try again later.
        </div>
        
        <div id="product-list" class="flex flex-col divide-y divide-gray-100"></div>
    </div>

    <script src="nav.js"></script>
    <script src="script.js"></script>
</body>
</html>
